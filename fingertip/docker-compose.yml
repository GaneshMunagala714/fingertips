services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./logs:/srv/logs
      - ./model/data:/srv/model/data   # team sign recordings (landmarks only)
  learn:
    build: ./learn
    env_file: .env                     # GEMINI_API_KEY and the WORKSTUDY_* settings
    restart: unless-stopped
    volumes:
      - ./learn/data:/data             # saved lessons (includes the demo lesson) and templates
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app, learn]
volumes:
  caddy_data:


