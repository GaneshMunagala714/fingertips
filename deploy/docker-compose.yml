# Vultr deploy: Fingertips behind Caddy (automatic HTTPS). Run from this folder:
#   DOMAIN=<ip-with-dashes>.sslip.io docker compose up -d --build
services:
  app:
    build: ..
    env_file: ../.env
    environment:
      PUBLIC_URL: https://${DOMAIN}
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddy_data:
